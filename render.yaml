services:
  - type: web
    name: nextrupee-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: prod
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-20b:free
      - key: LLM_FALLBACK_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
