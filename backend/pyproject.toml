[project]
name = "nextrupee-api"
version = "0.1.0"
description = "NextRupee decision engine API — deterministic ranking, gold intelligence, guarded LLM explanations"
requires-python = ">=3.10"  # deployment target is 3.12 (see Dockerfile, CI); 3.10 floor keeps local envs workable
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "networkx>=3.1",
]

[project.optional-dependencies]
rag = ["chromadb>=0.5"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.4", "hypothesis>=6.100"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # Depends(...) in defaults is idiomatic FastAPI

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
