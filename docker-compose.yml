# Local development: API with live reload. Supabase runs via `supabase start`
# (Supabase CLI) or stays unset — the API degrades to in-memory storage.
services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/app:/app/app
      - chroma-data:/app/.chroma
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  chroma-data:
